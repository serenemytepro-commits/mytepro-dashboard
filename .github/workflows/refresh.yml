name: MytePro Dashboard Refresh

on:
  schedule:
    - cron: '0 10 * * 4'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull HubSpot data and rebuild dashboard
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python scripts/refresh.py

      - name: Password-protect dashboard
        env:
          STATICRYPT_PASSWORD: ${{ secrets.DASHBOARD_PASSCODE }}
        run: >
          npx --yes staticrypt output/index.html -d output --short
          -t scripts/staticrypt_template.html
          --template-title "MytePro · Secure Access"
          --template-instructions "This dashboard is confidential. Enter the team passcode to continue."
          --template-placeholder "Enter passcode"
          --template-button "Unlock Dashboard"
          --template-error "Incorrect passcode — please try again."

      - name: Deploy to Netlify
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: python scripts/deploy.py
