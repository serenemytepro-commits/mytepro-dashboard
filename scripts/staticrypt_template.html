<html class="staticrypt-html">

            rel="stylesheet"
        />

        <style>
            :root {
                --bg: #080c10;
                --bg2: #0d1117;
                --bgc: #111820;
                --bdr: #1e2d3d;
                --bdrb: #2a3f57;
                --t1: #e6edf3;
                --t2: #8b949e;
                --tm: #484f58;
                --teal: #00d4aa;
                --blue: #1f6feb;
                --red: #f85149;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            .staticrypt-html,
            .staticrypt-body {
                height: 100%;
            }

            .staticrypt-content {
                height: 100%;
                margin: 0;
                background: var(--bg);
                color: var(--t1);
                font-family: "Inter", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                display: flex;
                align-items: center;
                justify-content: center;
                background-image: radial-gradient(
                    900px circle at 50% -10%,
                    rgba(0, 212, 170, 0.08),
                    transparent 60%
                );
            }

            .staticrypt-page {
                width: 100%;
                max-width: 400px;
                padding: 24px;
                margin: auto;
            }

            .staticrypt-form {
                position: relative;
                background: var(--bgc);
                border: 1px solid var(--bdr);
                border-radius: 12px;
                padding: 42px 34px 36px;
                text-align: center;
                overflow: hidden;
                box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
            }

            .staticrypt-form::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 3px;
                background: linear-gradient(90deg, var(--teal), var(--blue));
            }

            .brand {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 11px;
                margin-bottom: 6px;
            }

            .brand-diamond {
                width: 26px;
                height: 26px;
                background: linear-gradient(135deg, var(--teal), var(--blue));
                clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
                flex-shrink: 0;
            }

            .brand-name {
                font-size: 20px;
                font-weight: 700;
                letter-spacing: 0.04em;
                color: var(--t1);
            }

            .brand-sub {
                font-size: 10px;
                font-weight: 600;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--tm);
                margin-bottom: 22px;
            }

            .staticrypt-instructions {
                margin-bottom: 22px;
            }

            .staticrypt-title {
                font-size: 13px;
                font-weight: 600;
                color: var(--t2);
                margin-bottom: 5px;
            }

            .staticrypt-instructions p:last-child {
                font-size: 12px;
                color: var(--tm);
                line-height: 1.55;
            }

            .staticrypt-hr {
                margin: 0 0 22px;
                border: 0;
                border-top: 1px solid var(--bdr);
            }

            .staticrypt-password-container {
                position: relative;
                background: var(--bg2);
                border: 1px solid var(--bdr);
                border-radius: 7px;
                width: 100%;
                margin: 0 0 14px;
                transition: border-color 0.15s;
            }

            .staticrypt-password-container:focus-within {
                border-color: var(--teal);
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                outline: 0;
                width: 100%;
                color: var(--t1);
                font-family: "IBM Plex Mono", monospace;
                font-size: 14px;
                letter-spacing: 0.05em;
                padding: 14px 42px 14px 15px;
            }

            .staticrypt-form input::placeholder {
                color: var(--tm);
                font-family: "Inter", sans-serif;
                letter-spacing: 0;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.5;
                padding: 0;
                position: absolute;
                right: 13px;
                top: 50%;
                transform: translateY(-50%);
                filter: invert(0.8);
            }

            .staticrypt-toggle-password-visibility:hover {
                opacity: 0.9;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                letter-spacing: 0.08em;
                outline: 0;
                background: var(--teal);
                width: 100%;
                border: 0;
                border-radius: 7px;
                padding: 13px;
                color: #04140f;
                font-family: "Inter", sans-serif;
                font-size: 12.5px;
                font-weight: 700;
                cursor: pointer;
                transition: filter 0.15s;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                filter: brightness(1.08);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 9px;
                margin-bottom: 16px;
                font-size: 12px;
                color: var(--t2);
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.2);
                accent-color: var(--teal);
            }

            .staticrypt-footer {
                margin-top: 22px;
                font-size: 10px;
                letter-spacing: 0.04em;
                color: var(--tm);
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 0.25em solid var(--bdrb);
                border-right-color: var(--teal);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>

                    toggleIcon.alt = templateToggleAltHide;
